# ============================================================================
# Module Documentation Configuration — CopeX_WarrantyLabel
# ============================================================================
# Used by:
#   ./take-screenshots.sh /path/to/module/docs/module.conf
#   ./convert.sh          /path/to/module/docs/module.conf
# ============================================================================

# --- Required ---
MODULE_KEY="warranty-label"
MODULE_NAME="Warranty Label"
MODULE_SUBTITLE="EU Guarantee Notice & GARAN Label"

# --- Optional ---
MODULE_DESC="Extension for Magento 2"

# Auto-detection would also pick up nothing else — the module owns exactly one
# configuration section and adds no admin menu entry.
MODULE_CONFIG_SECTIONS="copex_warrantylabel"

# No admin page: the module has no etc/adminhtml/menu.xml. Product data is
# maintained on the product form, everything else in the configuration section.
# MODULE_ADMIN_PAGES=""

# Screenshots of the product form would show real catalog data — fill this in
# with the fixture values of the shop used for take-screenshots.sh so they are
# blurred out of the published PDF.
# MODULE_BLUR_PATTERNS=""
