name: Unit tests

# The module's dependencies live on repo.magento.com, which needs credentials. Forks have no access to the
# secret, so this job is skipped there instead of failing with a misleading red cross — the Lint workflow is
# what gives a fork useful feedback.
on:
  push:
    branches: [main, master]
    tags: ['*']
  pull_request:

jobs:
  phpunit:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd
          coverage: none
          tools: composer:v2

      - name: Check that Magento credentials are configured
        env:
          COMPOSER_AUTH: ${{ secrets.MAGENTO_COMPOSER_AUTH }}
        run: |
          if [ -z "$COMPOSER_AUTH" ]; then
            echo "::error::Secret MAGENTO_COMPOSER_AUTH is missing."
            echo "Create it with the JSON of a repo.magento.com key pair:"
            echo '{"http-basic":{"repo.magento.com":{"username":"<public key>","password":"<private key>"}}}'
            exit 1
          fi

      - name: Install dependencies
        env:
          COMPOSER_AUTH: ${{ secrets.MAGENTO_COMPOSER_AUTH }}
        run: |
          composer config repositories.magento composer https://repo.magento.com/
          composer install --no-interaction --no-progress --prefer-dist

      - name: Unit tests
        run: vendor/bin/phpunit --configuration phpunit.xml
